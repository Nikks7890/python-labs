[project]
name = "lab05-lazy-streams"
version = "0.1.0"
description = "Лабораторна робота 5: ліниві обчислення, генератори та itertools (варіант 5)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
